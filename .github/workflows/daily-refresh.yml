name: Daily Widget Refresh

on:
  schedule:
    # Run daily at 5 AM UTC (morning in Europe, after overnight Strava uploads)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all widgets'
        required: false
        type: boolean
        default: false

concurrency:
  group: widget-refresh
  cancel-in-progress: false  # Let current run finish

permissions:
  contents: write      # Commit generated files
  pages: write        # Deploy to GitHub Pages
  id-token: write     # OIDC for Pages

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # LTS for CI stability
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Ingestion source is intervals.icu (bridging Garmin Connect) since
      # Strava paywalled Standard-tier API access in June 2026. Requires the
      # INTERVALS_API_KEY repo secret; without it this step fails and the
      # pipeline rebuilds from committed data, same as any fetch outage.
      - name: Fetch new activities from intervals.icu
        id: fetch
        continue-on-error: true  # Use cached data if the API fails
        run: npm run fetch
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: '0'

      - name: Warn on fetch failure
        if: steps.fetch.outcome == 'failure'
        run: echo "::warning::intervals.icu fetch failed, rebuilding with existing data"

      - name: Compile TypeScript
        run: npm run build

      - name: Process statistics
        run: node dist/index.js compute-stats && node dist/index.js compute-advanced-stats

      - name: Compute geographic statistics
        id: geocode
        continue-on-error: true
        run: node dist/index.js compute-geo-stats

      - name: Warn on geocoding failure
        if: steps.geocode.outcome == 'failure'
        run: echo "::warning::Geocoding failed, widgets will use cached geo data"

      # compute-best-efforts output lands in gitignored data/stats/ (recomputed
      # every run), so it is deliberately absent from the commit step's
      # file_pattern below.
      - name: Compute best efforts
        id: best-efforts
        continue-on-error: true
        run: node dist/index.js compute-best-efforts

      - name: Warn on best-effort failure
        if: steps.best-efforts.outcome == 'failure'
        run: echo "::warning::Best-effort computation failed, records data will be stale"

      # data/dashboard/ is gitignored (regenerated every run), like data/stats/ —
      # deliberately absent from the commit step's file_pattern below.
      - name: Compute dashboard index
        id: dashboard-index
        continue-on-error: true
        run: node dist/index.js compute-dashboard-index

      - name: Warn on dashboard-index failure
        if: steps.dashboard-index.outcome == 'failure'
        run: echo "::warning::Dashboard index computation failed, the dashboard will serve a stale index"

      # compute-age-grading output lands in gitignored data/stats/ (recomputed
      # every run), so it is deliberately absent from the commit step's
      # file_pattern below, same as compute-best-efforts.
      #
      # This step reports `enabled: false` in CI, because
      # data/private/athlete-private.json does not and must not exist here
      # (it holds birthDate/sex, gitignored on purpose). That is the expected
      # and correct CI state, not a failure — do not "fix" it by committing
      # the private file. The step still exits 0: plan 18-08's contract
      # guarantees the disabled path returns successfully.
      - name: Compute age grading
        id: age-grading
        continue-on-error: true
        run: node dist/index.js compute-age-grading

      - name: Warn on age-grading failure
        if: steps.age-grading.outcome == 'failure'
        run: echo "::warning::Age-grading computation failed, age-grade data will be stale"

      # compute-gear-aggregate output lands in gitignored data/stats/
      # (recomputed every run), so it is deliberately absent from the commit
      # step's file_pattern below, same as compute-best-efforts.
      - name: Compute gear aggregate
        id: gear-aggregate
        continue-on-error: true
        run: node dist/index.js compute-gear-aggregate

      - name: Warn on gear-aggregate failure
        if: steps.gear-aggregate.outcome == 'failure'
        run: echo "::warning::Gear aggregate computation failed, gear data will be stale"

      # compute-training-load output lands in gitignored data/stats/
      # (recomputed every run), so it is deliberately absent from the commit
      # step's file_pattern below, same as compute-best-efforts.
      - name: Compute training load
        id: training-load
        continue-on-error: true
        run: node dist/index.js compute-training-load

      - name: Warn on training-load failure
        if: steps.training-load.outcome == 'failure'
        run: echo "::warning::Training load computation failed, training load data will be stale"

      - name: Build widgets
        run: npm run build-widgets

      # Phase 16 exit gate (WR-06): before this pair of steps was added, both
      # `npm test` and `npm run verify-dashboard` were wired in package.json but
      # never ran in the pipeline that publishes, so a regression in URL shape,
      # data copying, or the index contract deployed silently every night. Both
      # steps below are blocking, with no error-tolerant escape hatch, on purpose
      # -- that is the entire point of a gate. The verify step runs after `Build widgets`
      # because scripts/verify-dashboard-publish.mjs serves the built
      # dist/widgets/ directory over HTTP; running it earlier would probe a
      # stale or absent directory. The test step runs first so a logic
      # regression is reported before the slower HTTP probe. Necessary but not
      # sufficient: the HTTP probe exercises URL paths, not browser-side logic,
      # and could not have caught CR-01.
      - name: Run test suite
        run: npm test

      - name: Verify dashboard publish contract
        run: npm run verify-dashboard

      # data/stats/ is gitignored (regenerated every run) — listing it here would
      # make `git add` fail on an ignored path and skip the deploy below.
      # data/streams/ is safe to list: it's a committed data family, not
      # gitignored (confirmed against .gitignore), unlike data/stats/.
      - name: Commit updated data and stats
        id: commit
        continue-on-error: true  # Bookkeeping failure must not block the deploy
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: update activities and stats [skip ci]'
          file_pattern: 'data/activities/*.json data/sync-state.json data/geo/*.json data/streams/*.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Warn on commit failure
        if: steps.commit.outcome == 'failure'
        run: echo "::warning::Data commit failed, deploying anyway — sync state not persisted"

      # No `if: always()` here on purpose — dist/ is gitignored, so deploying after a
      # failed widget build would publish an empty dist over a working site.
      - name: Deploy widgets to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/widgets
          enable_jekyll: false
