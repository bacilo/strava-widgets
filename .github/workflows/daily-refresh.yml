name: Daily Widget Refresh

on:
  # Rebuild and redeploy whenever code or build inputs land on master. Without
  # this, a push that changed the site produced no deploy at all until the next
  # scheduled run — the site silently served the previous day's bundle. This bit
  # us repeatedly through phases 16-18, most visibly when the whole v2.0
  # milestone was pushed and nothing changed on the live URL.
  #
  # Loop safety (two independent guards, either one sufficient):
  #   1. The auto-commit step below tags its message '[skip ci]'.
  #   2. That step only writes data/activities, data/sync-state.json,
  #      data/geo/* and data/streams/* — none of which appear in `paths` here.
  # data/config/ and data/wma/ ARE listed: they are hand-maintained build inputs
  # (gear names, WMA factor tables) that CI never writes, so editing one should
  # rebuild.
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config*.ts'
      - 'data/config/**'
      - 'data/wma/**'
      # Hand-edited by the developer to withhold specific activities from PR
      # marking (see data/best-effort-exclusions.json). Editing it changes the
      # published records, so it must rebuild. CI never writes this file, so
      # it cannot self-trigger.
      - 'data/best-effort-exclusions.json'
  schedule:
    # Run daily at 5 AM UTC (morning in Europe, after overnight Strava uploads)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all widgets'
        required: false
        type: boolean
        default: false

concurrency:
  group: widget-refresh
  cancel-in-progress: false  # Let current run finish

permissions:
  contents: write      # Commit generated files
  pages: write        # Deploy to GitHub Pages
  id-token: write     # OIDC for Pages

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # LTS for CI stability
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Ingestion source is intervals.icu (bridging Garmin Connect) since
      # Strava paywalled Standard-tier API access in June 2026. Requires the
      # INTERVALS_API_KEY repo secret; without it this step fails and the
      # pipeline rebuilds from committed data, same as any fetch outage.
      - name: Fetch new activities from intervals.icu
        id: fetch
        continue-on-error: true  # Use cached data if the API fails
        run: npm run fetch
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: '0'

      - name: Warn on fetch failure
        if: steps.fetch.outcome == 'failure'
        run: echo "::warning::intervals.icu fetch failed, rebuilding with existing data"

      - name: Compile TypeScript
        run: npm run build

      # The chain's order and each step's mandatory/tolerated disposition are
      # declared exactly once, in src/compute-all-stats-steps.ts (CI-01, D-01)
      # — no ordering of the chain is re-expressed here. --ci selects
      # warn-and-continue for the six tolerated steps; compute-stats and
      # compute-advanced-stats stay fail-fast regardless (D-02).
      - name: Compute all statistics
        run: node dist/index.js compute-all-stats --ci

      - name: Build widgets
        run: npm run build-widgets

      # Phase 16 exit gate (WR-06): before this pair of steps was added, both
      # `npm test` and `npm run verify-dashboard` were wired in package.json but
      # never ran in the pipeline that publishes, so a regression in URL shape,
      # data copying, or the index contract deployed silently every night. Both
      # steps below are blocking, with no error-tolerant escape hatch, on purpose
      # -- that is the entire point of a gate. The verify step runs after `Build widgets`
      # because scripts/verify-dashboard-publish.mjs serves the built
      # dist/widgets/ directory over HTTP; running it earlier would probe a
      # stale or absent directory. The test step runs first so a logic
      # regression is reported before the slower HTTP probe. Necessary but not
      # sufficient: the HTTP probe exercises URL paths, not browser-side logic,
      # and could not have caught CR-01.
      - name: Run test suite
        run: npm test

      - name: Verify dashboard publish contract
        run: npm run verify-dashboard

      # data/stats/ is gitignored (regenerated every run) — listing it here would
      # make `git add` fail on an ignored path and skip the deploy below.
      # data/streams/ is safe to list: it's a committed data family, not
      # gitignored (confirmed against .gitignore), unlike data/stats/.
      - name: Commit updated data and stats
        id: commit
        continue-on-error: true  # Bookkeeping failure must not block the deploy
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: update activities and stats [skip ci]'
          file_pattern: 'data/activities/*.json data/sync-state.json data/geo/*.json data/streams/*.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Warn on commit failure
        if: steps.commit.outcome == 'failure'
        run: echo "::warning::Data commit failed, deploying anyway — sync state not persisted"

      # No `if: always()` here on purpose — dist/ is gitignored, so deploying after a
      # failed widget build would publish an empty dist over a working site.
      - name: Deploy widgets to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/widgets
          enable_jekyll: false
