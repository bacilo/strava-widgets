<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training Dashboard — Strava Analytics</title>
  <meta name="color-scheme" content="light dark">
  <!--
    `img-src` MUST list every basemap tile host used by
    RouteRenderer.addBasemapSwitcher (src/widgets/shared/route-utils.ts):
    CARTO serves the Light and Dark basemaps, OpenStreetMap serves Street,
    and OpenTopoMap serves Terrain. Leaflet loads tiles as plain <img>
    elements, so a bare `img-src 'self' data:` blocks every one of them —
    and its failure mode is silent: the route polyline still renders, so
    the detail page shows a correct route floating on a blank white canvas
    with nothing in the console to explain it (only "blocked" entries in
    the Network panel). The standalone widget pages have no CSP, which is
    why their maps kept working while the dashboard's did not.

    Keep this list narrow — add a host only when a basemap layer actually
    needs it, and never widen to a bare `*` or `https:`. If a new basemap
    provider is added to addBasemapSwitcher, add its host here in the same
    commit or that layer will silently render blank.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org https://*.tile.opentopomap.org; connect-src 'self'">
  <!--
    Theme bootstrap: src/dashboard/theme.ts is the source of truth for this
    logic (parseThemeMode / resolveEffectiveTheme). This inline copy is a
    DELIBERATE duplication and must stay behaviourally identical, including
    the 'light' | 'dark' | 'auto' allow-list — that allow-list is the
    T-16-TH-01 mitigation and must never be dropped from this inline copy.
    It must run synchronously, before the stylesheet link, because a
    deferred module script is not run until after HTML parsing, which would
    let the page paint the wrong theme first (RESEARCH.md Pitfall 4).
  -->
  <script>
    (function () {
      var STORAGE_KEY = 'dashboard-theme';
      var mode = 'auto';
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw === 'light' || raw === 'dark' || raw === 'auto') {
          mode = raw;
        }
      } catch (e) {
        mode = 'auto';
      }
      var effective = mode;
      if (mode === 'auto') {
        effective = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', effective);
    })();
  </script>
  <script type="module" crossorigin src="./assets/index-D-Ts7X8C.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-B573RjUr.css">
</head>

  </noscript>
</body>
</html>
